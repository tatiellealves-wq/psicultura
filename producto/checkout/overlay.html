<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Mono:wght@700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  #b{position:relative;width:1584px;height:672px;overflow:hidden;font-family:'Inter',sans-serif}
  #b img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  /* scrim para legibilidade sobre o centro claro */
  #b .scrim{position:absolute;inset:0;background:
     radial-gradient(70% 120% at 50% 50%, rgba(6,51,58,.72) 0%, rgba(6,51,58,.45) 45%, rgba(6,51,58,0) 78%),
     linear-gradient(180deg, rgba(6,51,58,.35) 0%, rgba(6,51,58,0) 30%, rgba(6,51,58,.35) 100%)}
  #b .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
     justify-content:center;text-align:center;padding:0 12%}
  .eyebrow{font-family:'Space Mono',monospace;font-weight:700;font-size:24px;letter-spacing:.28em;
     text-transform:uppercase;color:#F4C46B;text-shadow:0 2px 10px rgba(0,0,0,.5);margin-bottom:14px}
  h1{font-family:'Fraunces',serif;font-weight:900;font-size:72px;line-height:1.02;color:#fff;
     letter-spacing:-.01em;text-shadow:0 4px 26px rgba(3,30,34,.65);max-width:16ch}
  h1 em{font-style:italic;font-weight:600;color:#FFD489}
  .badges{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap;justify-content:center}
  .pill{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.14);
     border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(3px);
     padding:11px 20px;border-radius:999px;color:#fff;font-weight:600;font-size:22px;
     text-shadow:0 1px 6px rgba(0,0,0,.4)}
  .pill b{color:#7BE0A0;font-size:22px;line-height:1}
</style></head>
<body>
<div id="b">
  <img class="bg" src="banner_a.png" alt="">
  <div class="scrim"></div>
  <div class="wrap">
    <div class="eyebrow">Oferta de lanzamiento</div>
    <h1>Estás a un paso de tu cultivo <em>rentable</em></h1>
    <div class="badges">
      <span class="pill"><b>✓</b> Acceso inmediato</span>
      <span class="pill"><b>✓</b> Guía + Calculadora de ROI</span>
      <span class="pill"><b>✓</b> Garantía de 7 días</span>
    </div>
  </div>
</div>
</body></html>
